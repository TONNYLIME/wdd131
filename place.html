<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 - Dynamic Web Fundamentals - Tonny Lime</title>
    <meta name="description" content="WDD 131 - Dynamic Web Fundamentals - Place">
    <meta name="author" content="Tonny lumwaji lime">
    <link rel="stylesheet" href="./styles/place.css">
    <link rel="stylesheet" href="./styles/place-large.css">
    <script src="./scripts/place.js" defer></script>
    <script src="./scripts/getdates.js" defer></script>

</head>
<body>
    <header>
        <h1>Swaziland</h1>
    </header>
    <div></div>
    <main class="hero">
            <img src="./images/mbabane.webp" alt="Mbabane, capital city of Eswatini" class="place" width="" height="">

        
        <section class="top-left">
            <h2>Data</h2>
            <p class="weather" id="area">Area:      --sq km</p>
            <p class="weather" id="population">Population:      --</p>
            <p class="weather" id="capital">Capital:      --</p>
            <p class="weather" id="languages">Languages:      --</p>
            <p class="weather" id="currency">Currency:      --</p>
            <p class="weather" id="timeZone">Time Zone:      --</p>
            <p class="weather" id="callingCode">Calling Code:   --</p>
            <p class="weather" id="internetTld">Internet TLD: --</p>
        </section>
        <section class="bottom-right">
            <h2>Weather</h2>
            <img src="./images/weather-icon.png" alt="weather logo" width="50px" height="50px">
            <p class="weather" id="temperature">Temperature: --°C</p>
            <p class="weather" id="condition">Condition: --</p>
            <p class="weather" id="wind">Wind: -- km/h</p>
            <p class="weather" id="windChill">Wind Chill: --°C</p>
            
        </section>
    </main>
    <footer>
        <p>©<span id="currentyear"></span>🌹Tonny Lumwaji Lime🌹Kenya</p>
        <p><span id="lastModified"></span></p>
    </footer>
</body>
</html>
