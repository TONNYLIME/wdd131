<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Lumix Subaru Solenoids</title>
    <link rel="stylesheet" href="styles/mains.css">
    <link rel="stylesheet" href="styles/main-large.css">
    <script src="scripts/main.js" defer></script>
    <script src="../scripts/getdates.js" defer></script>
    <meta name="description" content="WDD 131-Lumix Subaru Solenoid . shows my target customer how to contact me ">
    <meta name="author" content="Tonny Lumwaji Lime">
</head>
<body>
    <header>
        <div class="logo-title">
            <img src="images/subaru-logo.png" alt="subaru logo" class="logo">
            <h2>Contact Lumix Subaru Solenoids</h2>
        </div>
    
        <nav>
            <ul id="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="solenoid.html">Solenoids</a></li>
                <li><a class="active" href="contacts.html">Contacts</a></li>
            </ul>
        </nav>

    </header>
    <main>
        <section class="contact-info">
            <h2>Get in Touch</h2>
            <p>
                For subaru CVT guidance, diagnosis assistance, or product
                 support and repair, please fill out the form below.I will
                 respond as soon as possible.
            </p>
        </section>
        <section class="form-section">
            <h1>Contact form</h1>
            <form method="post" id="contact-form" action="https://formsubmit.co/Tonnylumwaji@yahoo.com">
                <label for="name">Full Name:</label>
                <input type="text" id="name" required placeholder="Enter your name">
                <label for="email">Email Address:</label>
                <input type="email" id="email" required placeholder="Enter your email">
                <label for="tel">Phone Number:</label>
                <input type="text" id="tel" required placeholder="Enter your number">
                <label for="model">Subaru Model:</label>
                <select name="" id="model" required>
                    <option value="">Select your model</option>
                    <option value="forester">Forester</option>
                    <option value="Outback">Outback</option>
                    <option value="impreza">Impreza</option>
                    <option value="legacy">Legacy</option>
                    <option value="xv/crosstrek">XV / Crosstrek</option>
                    <option value="wrx">WRK</option>
                    <option value="levorg">Levork</option>
                </select>
                <label for="messages">Messages:</label>
                <textarea name="" id="messages" rows="5" required placeholder="Describe your
                issue or concern"></textarea>
                 <!-- After submitting, go to a thank-you page -->
                <input  type="hidden" name="_next" value="thankyou.html">

                <!-- Disable FormSubmit captcha -->
                <input type="hidden" name="_captcha" value="false">
                <button type="submit" id="submitBtn">Send Message</button>
            </form>
            <div id="confirmation" class="confirmation"></div>
        </section>
    </main>
    <footer>
        <p>©<span id="currentyear"></span>🌹Tonny Lumwaji Lime🌹Kenya</p>
        <p><span id="lastModified"></span></p>
        <p><a href="references.html">References</a></p>
    </footer>
</body>
</html>
